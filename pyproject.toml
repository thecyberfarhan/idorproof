[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idorproof"
version = "0.1.0"
description = "Evidence-based BOLA/IDOR detection by cross-session request replay"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Farhan Hussain" }]
keywords = ["bola", "idor", "api-security", "owasp", "authorization", "pentest", "appsec"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
idorproof = "idorproof.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["idorproof"]
